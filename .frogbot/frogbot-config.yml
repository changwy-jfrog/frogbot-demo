- params:
    git:
      repoName: frogbot-demo
      branches:
        - main
    scan:
      failOnSecurityIssues: false
      includeAllVulnerabilities: true
      # SCA targets — Frogbot needs one entry per manifest dir.
      # JAS scans (secrets / IaC / SAST / CA) run across the whole repo
      # regardless of these entries.
      projects:
        - workingDirs:
            - sca/npm-lodash
          installCommand: npm install
        - workingDirs:
            - sca/go-gin
        - workingDirs:
            - sca/maven-log4j
        - workingDirs:
            - sca/pypi-requests
          pipRequirementsFile: requirements.txt
        - workingDirs:
            - jas-contextual
          installCommand: npm install
        - workingDirs:
            - license-maven-gpl
